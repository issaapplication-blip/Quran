name: Quran PWA quality

on:
  pull_request:
    paths:
      - "app.js"
      - "features.js"
      - "sw.js"
      - "index.html"
      - "styles.css"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "manifest.webmanifest"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/quran-quality.yml"
      - "docs/DEVELOPMENT.md"
  push:
    branches:
      - main
      - "feature/quran-compass-prayer-20261107"
    paths:
      - "app.js"
      - "features.js"
      - "sw.js"
      - "index.html"
      - "styles.css"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "manifest.webmanifest"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/quran-quality.yml"
      - "docs/DEVELOPMENT.md"

permissions:
  contents: read

concurrency:
  group: quran-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-pwa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check features.js
          node --check sw.js
          node --check scripts/make-icons.mjs
          node --check scripts/serve.mjs

      - name: Verify source data and app invariants
        run: npm test

      - name: Verify local offline-capable HTTP delivery
        run: npm run test:e2e

      - name: Ensure tests did not mutate tracked project files
        run: git diff --exit-code
